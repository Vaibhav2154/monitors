startDelaySeconds: 0
lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:

# JVM metrics
- pattern: 'java.lang<type=Memory><HeapMemoryUsage>(\w+)'
  name: jvm_memory_heap_$1_bytes
  type: GAUGE

- pattern: 'java.lang<type=GarbageCollector,name=(.+)><CollectionCount>'
  name: jvm_gc_collection_count
  labels:
    gc: "$1"
  type: COUNTER


# Kafka messages
- pattern: 'kafka.server<type=BrokerTopicMetrics, name=(.+)PerSec, topic=(.+)><Count>'
  name: kafka_server_brokertopicmetrics_$1_total
  labels:
    topic: "$2"
  type: COUNTER


# Kafka bytes
- pattern: 'kafka.server<type=BrokerTopicMetrics, name=(.+)PerSec><Count>'
  name: kafka_server_brokertopicmetrics_$1_total
  type: COUNTER


# Kafka network requests
- pattern: 'kafka.network<type=RequestMetrics, name=(.+), request=(.+)><Count>'
  name: kafka_network_requestmetrics_$1_total
  labels:
    request: "$2"
  type: COUNTER


# Kafka controller metrics
- pattern: 'kafka.controller<type=(.+), name=(.+)><Value>'
  name: kafka_controller_$1_$2
  type: GAUGE


# fallback
- pattern: ".*"
